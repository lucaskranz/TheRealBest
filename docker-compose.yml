services:
  postgres:
    image: postgres:16-alpine
    container_name: therealbest-postgres
    environment:
      POSTGRES_DB: therealbest
      POSTGRES_USER: therealbest
      POSTGRES_PASSWORD: therealbest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
